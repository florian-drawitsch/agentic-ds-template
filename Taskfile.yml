version: '3'

silent: true

env:
  VIRTUAL_ENV: ''

vars:
  FACTORY: plugins/factory/skills/factory/scripts/factory.py

tasks:
  setup:
    desc: Install the locked development environment
    cmds:
      - uv sync --locked

  build:
    desc: Regenerate marketplaces and local plugin manifests from catalog.toml
    cmds:
      - uv run python scripts/build.py

  lint:
    desc: Check formatting, lint rules and types
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run ty check

  format:
    desc: Format and autofix
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test-e2e:
    desc: Render a pairwise set of projects and run each one's full merge gate (slow)
    cmds:
      - uv run pytest -m slow -n0 -p no:cacheprovider {{.CLI_ARGS}}

  validate:
    desc: Validate the marketplace and plugin manifests with Claude Code
    preconditions:
      - sh: command -v claude
        msg: Claude Code CLI is required for manifest validation
    cmds:
      - claude plugin validate .
      - for: { var: PLUGINS }
        cmd: claude plugin validate {{.ITEM}}
    vars:
      PLUGINS:
        sh: find plugins -mindepth 1 -maxdepth 1 -type d

  eval:
    desc: Score a plugin's skills against a no-plugin baseline (spends model tokens)
    summary: |
      Runs plugins/<PLUGIN>/evals/ with `claude plugin eval`, three runs per case and arm.
      PLUGIN defaults to project. Examples:
        task eval -- --case '03-*' --max-cost-usd 5
        task eval PLUGIN=factory
    vars:
      PLUGIN: '{{.PLUGIN | default "project"}}'
    preconditions:
      - sh: command -v claude
        msg: Claude Code CLI is required for skill evals
    cmds:
      - claude plugin eval plugins/{{.PLUGIN}} --ablation with-without --no-publish {{.CLI_ARGS}}

  check:
    desc: 'Merge gate: generated files current, lint, types, tests, manifests'
    cmds:
      - uv run python scripts/build.py --check
      - task: lint
      - task: test
      - task: validate

  factory:init:
    desc: Create the factory labels and the Kanban board for this repository (ADR-0033)
    summary: |
      Idempotent. Needs gh with the project scope (`gh auth refresh -s project`).
    cmds:
      - uv run --script {{.FACTORY}} init {{.CLI_ARGS}}

  factory:status:
    desc: Show factory issues per state, spend against the caps and the next action
    cmds:
      - uv run --script {{.FACTORY}} status {{.CLI_ARGS}}

  factory:tick:
    desc: Print the next factory action without changing anything
    cmds:
      - uv run --script {{.FACTORY}} tick --dry-run {{.CLI_ARGS}}

  factory:sync:
    desc: Mirror the label state of open factory issues into the board
    cmds:
      - uv run --script {{.FACTORY}} sync

  dev:
    desc: Register this working copy as the marketplace in both CLIs
    cmds:
      - claude plugin marketplace add {{.ROOT_DIR}}
      - codex plugin marketplace add {{.ROOT_DIR}}
