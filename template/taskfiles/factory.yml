version: '3'

# Ticket factory (ADR-0033 of agentic-ds-template), in development. The script is a project
# copy of the `factory` plugin's controller.

tasks:
  init:
    desc: Create the factory labels and the Kanban board for this repository
    summary: |
      Idempotent. Needs the GitHub repository and gh with the project scope
      (`gh auth refresh -s project`). `--no-board` creates the labels only.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py init {{.CLI_ARGS}}

  status:
    desc: Show factory issues per state, spend against the caps and the next action
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py status {{.CLI_ARGS}}

  tick:
    desc: Take the next factory action (`-- --dry-run` prints it instead)
    summary: |
      One tick claims, implements or verifies at most one issue. CI passes `--scheduled`,
      which also mirrors every card with its label.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py tick {{.CLI_ARGS}}

  labels:
    desc: Create the missing factory labels without touching the board
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py labels

  loop:
    desc: Run the tick locally every N seconds (default 1800) until interrupted
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        while true; do
          uv run --script scripts/agent/factory.py tick --scheduled || true
          sleep {{.CLI_ARGS | default "1800"}}
        done

  report:
    desc: Post the `daily` or `weekly` report, or run the `retro` check
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py report {{.CLI_ARGS}}

  sync:
    desc: Mirror the label state of open factory issues into the board
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py sync

  secrets:
    interactive: true
    desc: Set the GitHub Actions secrets step by step (`-- --check` only lists missing ones)
    summary: |
      Opens the token pages in the browser, can run `claude setup-token`, and stores each value
      with `gh secret set` from stdin. Running locally with `task factory:loop` needs no secrets.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/factory.py secrets {{.CLI_ARGS}}
