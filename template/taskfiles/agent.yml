version: '3'

tasks:
  status:
    desc: Show the repository state and delivery runs an agent session starts from
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/status.py
      - uv run --script scripts/agent/deliver.py status

  deliver:
    desc: Deliver a committed plan unattended in a new worktree, e.g. PLAN=docs/plans/x.md HARNESS=codex
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [PLAN]
    vars:
      HARNESS: '{{.HARNESS | default "claude"}}'
    cmds:
      - uv run --script scripts/agent/deliver.py headless --plan {{.PLAN}} --harness {{.HARNESS}} {{.CLI_ARGS}}

  doctor:
    desc: Check that the agent hooks and roles are installed
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run --script scripts/agent/deliver.py doctor
