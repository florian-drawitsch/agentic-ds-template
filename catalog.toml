# Single source for this repository's plugin marketplace.
# `task build` generates both marketplace files and the manifests of local plugins from it.

[marketplace]
name = "agentic-ds-template"
display_name = "Agentic DS Template"
description = "Curated agent plugins for data science projects, for Claude Code and Codex"
version = "0.1.0"
owner = "Florian Drawitsch"
license = "MIT"

# Third-party plugins are pinned. Claude Code pins the commit; Codex pins the tag.
# Bump both together after reading the upstream release notes, and note the bump in the changelog.
[[plugins]]
name = "superpowers"
description = "Brainstorming, planning, test-driven execution, code review and branch finishing"
category = "Developer Tools"
harnesses = ["claude", "codex"]
source = { type = "git", repo = "obra/superpowers", ref = "v6.4.2", sha = "8ca22dba9a94f28898bbce59f2537ff4d87c747d" }

[[plugins]]
name = "project"
description = "Plan delivery to a verified pull request, implementer and reviewer roles, cross-vendor review"
category = "Developer Tools"
harnesses = ["claude", "codex"]
source = { type = "local", path = "./plugins/project" }
