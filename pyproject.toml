[project]
name = "agentic-ds-template"
version = "0.1.0"
description = "Copier template and plugin marketplace for agentic data science projects"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "copier>=9.18.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "zizmor>=1.32.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "PTH", "RET", "TRY", "PT"]
ignore = ["D100", "D104", "D105", "D107", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel workers; pass `-n0` to debug a single test in one process.
addopts = "-ra -m 'not slow' -n auto --dist load --durations=10"
strict_markers = true
markers = ["slow: renders projects and runs their full merge gate (minutes)"]
filterwarnings = ["ignore::copier.errors.DirtyLocalWarning"]

[tool.ty.src]
exclude = ["template"]
